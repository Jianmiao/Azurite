name: Validate portable source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Validate source-suite dependency boundaries
        shell: pwsh
        run: ./tests/Test-SourcePlan.ps1
      - name: Build Core and run all portable checks
        shell: pwsh
        run: ./tools/Test-Source.ps1 -Suite Portable
      - name: Parse release scripts
        shell: pwsh
        run: |
          foreach ($path in @('tools/Package-Release.ps1', 'tools/Test-ReleaseArchive.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
